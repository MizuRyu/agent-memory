[project]
name = "agent-memory"
version = "0.1.0"
description = "Long-term memory system for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "sentence-transformers>=3.0",
    "transformers>=4.48.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
]

[project.scripts]
agent-memory = "agent_memory.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
